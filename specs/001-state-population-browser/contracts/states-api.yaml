openapi: 3.0.3
info:
  title: State Population Browser API
  version: 1.0.0
  description: REST API for US states and counties population data
paths:
  /states:
    get:
      summary: Retrieve all 51 US states (Root alias)
      responses:
        '200':
          description: List of all states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/State'
  /state/{name}:
    get:
      summary: Retrieve counties for a specific state (Root alias)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: State name (e.g. Alabama, New York)
      responses:
        '200':
          description: Array of counties in the state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/County'
        '404':
          description: State not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Malformed URL encoding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      summary: Service health check (Root alias)
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: connected
        '503':
          description: Database disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  db:
                    type: string
                    example: disconnected
  /api/states:
    get:
      summary: Retrieve all 51 US states (/api prefix)
      responses:
        '200':
          description: List of all states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/State'
  /api/state/{name}:
    get:
      summary: Retrieve counties for a specific state (/api prefix)
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: State name (e.g. Alabama, New York)
      responses:
        '200':
          description: Array of counties in the state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/County'
        '404':
          description: State not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Malformed URL encoding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/health:
    get:
      summary: Service health check (/api prefix)
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  db:
                    type: string
                    example: connected
        '503':
          description: Database disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  db:
                    type: string
                    example: disconnected
components:
  schemas:
    State:
      type: object
      required:
        - id
        - state
        - population
        - counties
        - detail
      properties:
        id:
          type: integer
        state:
          type: string
          example: Alabama
        population:
          type: integer
          example: 4833722
        counties:
          type: integer
          example: 67
        detail:
          type: string
          example: /api/state/Alabama
    County:
      type: object
      required:
        - county
        - population
      properties:
        county:
          type: string
          example: Autauga County
        population:
          type: integer
          example: 55246
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: State not found
